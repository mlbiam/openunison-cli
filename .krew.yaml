apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: openunison-cli
spec:
  version: {{ .TagName }}
  homepage: https://github.com/openunison/openunison-cli
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-{{ .TagName }}-macos.zip"  .TagName  }}
    bin: oulogin
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-{{ .TagName }}-macos-arm64.zip"  .TagName  }}
    bin: oulogin
  - selector:
      matchLabels:
        os: linux
    {{addURIAndSha "https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-{{ .TagName }}-linux.zip"  .TagName  }}
    bin: oulogin
  - selector:
      matchLabels:
        os: windows
    {{addURIAndSha "https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-{{ .TagName }}-win.zip"  .TagName  }}
    bin: oulogin.exe
  shortDescription: "Login to a kubernetes cluster via OpenUnison"
  description: |
    kubectl exec plugin that will launch a browser to authenticate you 
    without having a pre-existing kubectl configuration file.  The first
    time you execute this plugin, include the host of your OpenUnison 
    server and the plugin will launch a browser and authenticate you.  As
    you work with kubectl it will keep your short-lived tokens updated and
    if they expire, automatically re-launch a browser window to authenticate
    you.